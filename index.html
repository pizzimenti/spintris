<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spintris</title>
  <style>
    :root { color-scheme: dark; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #04040a;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #e8e8f0;
    }
    #game { display: block; width: 100%; height: 100%; }

    .hud {
      position: fixed;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      background: rgba(10, 12, 20, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 14px;
      pointer-events: none;
    }
    #stats { top: 24px; left: 24px; padding: 18px 22px; min-width: 180px; }
    #stats .row {
      display: flex; justify-content: space-between; align-items: baseline;
      gap: 16px; margin: 5px 0;
    }
    #stats .label {
      font-size: 11px; letter-spacing: 1.6px; text-transform: uppercase;
      opacity: 0.55;
    }
    #stats .value {
      font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums;
      letter-spacing: 0.5px;
    }

    #title {
      position: fixed; top: 24px; right: 24px;
      font-size: 26px; font-weight: 800; letter-spacing: 6px;
      opacity: 0.92; pointer-events: none;
      text-shadow: 0 0 24px rgba(255, 170, 80, 0.28);
    }
    #backend {
      position: fixed; top: 62px; right: 24px;
      font-size: 10px; letter-spacing: 2.5px; opacity: 0.5;
      pointer-events: none;
    }

    #controls {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%);
      padding: 10px 22px;
      font-size: 11px; letter-spacing: 1.5px;
      opacity: 0.7; text-align: center; white-space: nowrap;
      pointer-events: none;
    }
    kbd {
      display: inline-block;
      padding: 2px 7px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-bottom-color: rgba(255, 255, 255, 0.06);
      border-radius: 4px;
      font-family: inherit;
      font-size: 10px;
      margin: 0 2px;
      letter-spacing: 0.5px;
    }

    #overlay {
      position: fixed; inset: 0; display: none;
      align-items: center; justify-content: center;
      background: rgba(0, 0, 0, 0.62);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 10;
    }
    #overlay.show { display: flex; }
    #overlay .panel {
      text-align: center;
      padding: 40px 56px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 18px;
      background: rgba(14, 14, 22, 0.85);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
    }
    #overlay h1 {
      font-size: 38px; margin-bottom: 6px;
      letter-spacing: 5px; font-weight: 800;
    }
    #overlay p { opacity: 0.75; margin-top: 4px; }
    #overlay .hint {
      font-size: 11px; opacity: 0.55; margin-top: 22px;
      letter-spacing: 1.5px; text-transform: uppercase;
    }

    /* Engine + quality panel sits directly below score panel */
    #engine {
      top: 180px;
      left: 24px;
      padding: 14px 22px;
      min-width: 180px;
    }
    #engine .section {
      display: flex; justify-content: space-between; align-items: baseline;
      gap: 16px; margin: 3px 0;
    }
    #engine .lbl {
      font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase;
      opacity: 0.5;
    }
    #engine .v {
      font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums;
      letter-spacing: 0.3px;
    }
    #engine .adapter {
      font-size: 10px; opacity: 0.55; font-variant-numeric: tabular-nums;
      margin-top: 6px; line-height: 1.3; max-width: 200px;
      word-break: break-word;
    }
    #engine .divider {
      height: 1px;
      background: rgba(255, 255, 255, 0.08);
      margin: 8px -6px;
    }
    #quality {
      display: flex; gap: 4px; margin-top: 4px;
      pointer-events: auto; /* slider is interactive even inside .hud */
    }
    #quality button {
      flex: 1;
      padding: 6px 0;
      font-size: 10px;
      font-family: inherit;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.55);
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    #quality button:hover {
      color: rgba(255, 255, 255, 0.85);
      background: rgba(255, 255, 255, 0.08);
    }
    #quality button.active {
      color: #ffd699;
      background: rgba(255, 170, 80, 0.14);
      border-color: rgba(255, 170, 80, 0.45);
    }

    #loading {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; letter-spacing: 5px;
      opacity: 0.6;
      z-index: 5;
    }
    #loading.hide { display: none; }
  </style>
</head>
<body>
  <div id="loading">INITIALIZING</div>
  <canvas id="game"></canvas>

  <div id="stats" class="hud">
    <div class="row"><span class="label">Score</span><span class="value" id="score">0</span></div>
    <div class="row"><span class="label">Level</span><span class="value" id="level">1</span></div>
    <div class="row"><span class="label">Lines</span><span class="value" id="lines">0</span></div>
  </div>

  <div id="engine" class="hud">
    <div class="section"><span class="lbl">Engine</span><span class="v" id="eng-backend">—</span></div>
    <div class="section"><span class="lbl">FPS</span><span class="v" id="eng-fps">—</span></div>
    <div class="section"><span class="lbl">Rez</span><span class="v" id="eng-pixels">—</span></div>
    <div class="divider"></div>
    <div class="section"><span class="lbl">Quality</span></div>
    <div id="quality">
      <button data-q="low">Low</button>
      <button data-q="medium">Med</button>
      <button data-q="high">High</button>
    </div>
  </div>

  <div id="title">SPINTRIS</div>
  <div id="backend">—</div>

  <div id="controls">
    <kbd>&larr;</kbd><kbd>&rarr;</kbd> move
    &nbsp;·&nbsp; <kbd>&uarr;</kbd> rotate
    &nbsp;·&nbsp; <kbd>&darr;</kbd> soft drop
    &nbsp;·&nbsp; <kbd>SPACE</kbd> hard drop
    &nbsp;·&nbsp; <kbd>P</kbd> pause
  </div>

  <div id="overlay">
    <div class="panel">
      <h1 id="overlay-title">GAME OVER</h1>
      <p id="overlay-message">Final score: 0</p>
      <p class="hint">Press <kbd>R</kbd> to restart</p>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.184.0/build/three.webgpu.js",
      "three/webgpu": "https://unpkg.com/three@0.184.0/build/three.webgpu.js",
      "three/tsl": "https://unpkg.com/three@0.184.0/build/three.tsl.js",
      "three/addons/": "https://unpkg.com/three@0.184.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
